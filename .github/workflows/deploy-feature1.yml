name: Deploy feature1 to Salesforce

on:
  push:
    branches:
      - feature1

jobs:
  deploy-to-salesforce:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install Salesforce CLI
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      # 3. Create JWT private key from GitHub Secret
      - name: Create JWT Key File
        run: |
          echo "${{ secrets.SF_JWT_PRIVATE_KEY }}" > server.key
          chmod 600 server.key

      # 4. Authenticate to Salesforce
      - name: Authenticate to Salesforce
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias targetOrg \
            --set-default

      # 5. Verify authentication
      - name: Verify Salesforce Org
        run: |
          sf org display --target-org targetOrg

      # 6. Deploy Salesforce metadata
      - name: Deploy to Salesforce
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org targetOrg \
            --wait 30
