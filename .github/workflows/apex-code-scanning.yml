on:
 push:
    branches:
      - feature1
 
permissions:
  contents: read
  security-events: write
 
jobs:
  apex-scan:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Run Salesforce Code Analyzer
        uses: forcedotcom/run-code-analyzer@v1.0.0
        with:
          run-command: run
          run-arguments: --normalize-severity
          results-artifact-name: code-analyzer-results